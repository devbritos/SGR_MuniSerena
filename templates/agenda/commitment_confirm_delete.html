{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-danger text-white">
                <h1 class="h5 mb-0"><i class="bi bi-trash3 me-2"></i>Eliminar compromiso</h1>
            </div>
            <div class="card-body p-4">
                <div class="alert alert-warning">
                    Esta acción no se puede deshacer.
                </div>
                <p>Se eliminará el compromiso de <strong>{{ object.applic_name }}</strong>, con fecha {{ object.commitment_date|date:"d/m/Y" }}.</p>
                <form method="post" class="d-flex justify-content-end gap-2 pt-3 border-top">
                    {% csrf_token %}
                    <a href="{% url 'agenda:commitment_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger" data-confirm-delete="El compromiso se eliminará permanentemente.">
                        <i class="bi bi-trash3 me-1"></i>Sí, eliminar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
