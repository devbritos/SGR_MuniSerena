{% extends "base.html" %}
{% block title %}Desactivar ítem{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-6"><div class="card shadow-sm border-danger">
    <div class="card-header bg-danger text-white"><h1 class="h5 mb-0">Desactivar ítem</h1></div>
    <div class="card-body"><p>¿Quieres desactivar <strong>{{ object.service }}</strong>?</p>
        <form method="post">{% csrf_token %}<button class="btn btn-danger" data-confirm-delete="El ítem se desactivará y conservará sus relaciones históricas.">Desactivar</button> <a class="btn btn-outline-secondary" href="{% url 'configuration:measuring_list' %}">Cancelar</a></form>
    </div>
</div></div></div>
{% endblock %}
