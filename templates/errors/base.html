<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>{% block title %}Aviso — SGR{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { color-scheme: light; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 1.5rem;
            background: #f4f6f8;
            color: #24292f;
            font-family: Arial, sans-serif;
        }
        .error-card {
            width: min(100%, 38rem);
            padding: clamp(1.5rem, 5vw, 3rem);
            border: 1px solid #d8dee4;
            border-radius: 1rem;
            background: #fff;
            box-shadow: 0 1rem 2.5rem rgb(31 35 40 / 10%);
        }
        .error-code {
            display: inline-block;
            margin-bottom: 1rem;
            padding: .3rem .7rem;
            border: 1px solid #6e7781;
            border-radius: 999px;
            color: #24292f;
            font-size: .9rem;
            font-weight: 700;
            letter-spacing: .04em;
        }
        .error-card h1 { font-size: clamp(1.5rem, 4vw, 2rem); }
        .error-card p { color: #424a53; line-height: 1.6; }
        .error-actions { display: flex; flex-wrap: wrap; gap: .75rem; }
        .error-actions .btn { min-height: 2.75rem; }
        a:focus-visible, button:focus-visible {
            outline: 3px solid #005fcc;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main class="error-card" aria-labelledby="error-heading">
        <p class="error-code">Estado {% block error_code %}{% endblock %}</p>
        <h1 id="error-heading">{% block error_heading %}{% endblock %}</h1>
        <p>{% block error_message %}{% endblock %}</p>
        <div class="error-actions">{% block error_actions %}{% endblock %}</div>
        <p class="small mt-4 mb-0">Sistema de Gestión de Resultados · Municipalidad de La Serena</p>
    </main>
    <script>
        document.querySelectorAll('[data-go-back]').forEach(function (button) {
            button.addEventListener('click', function () {
                if (window.history.length > 1) {
                    window.history.back();
                } else {
                    window.location.assign('/');
                }
            });
        });
    </script>
</body>
</html>
