{% extends "base.html" %}

{% block content %}
<div class="container mt-4 mb-5" style="max-width: 680px;">
    <div class="card border-0 shadow-sm">
        <div class="card-header text-white py-3" style="background: linear-gradient(135deg, #9e2a2b 0%, #7a2021 100%);">
            <h4 class="mb-0 fw-bold fs-5">
                <i class="bi bi-trash3 me-2"></i>Eliminar actividad
            </h4>
        </div>
        <div class="card-body p-4">
            <div class="alert alert-warning border-0 d-flex align-items-start" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2 mt-1"></i>
                <div>
                    <strong>Atención:</strong> esta acción eliminará permanentemente el registro y no podrá revertirse.
                </div>
            </div>

            <div class="mb-4">
                <p class="text-muted mb-2">Registro a eliminar</p>
                <h5 class="fw-bold mb-1">{{ object.application }}</h5>
                <p class="mb-0 text-secondary">
                    <i class="bi bi-calendar3 me-2"></i>{{ object.date }}
                </p>
            </div>

            <form method="post" id="delete-form">
                {% csrf_token %}
                <div class="d-flex justify-content-end gap-2 mt-3 pt-3 border-top">
                    <a href="{% url 'activities:activity_list' %}" class="btn btn-outline-secondary px-4">
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-danger px-4" data-confirm-delete="Se eliminará la actividad '{{ object.application }}'. Esta acción no se puede deshacer.">
                        <i class="bi bi-trash3 me-1"></i> Sí, eliminar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
