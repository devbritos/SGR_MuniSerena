{% extends "base.html" %}

{% block title %}Contraseña actualizada{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-4 text-center" style="width: 350px;">
        <h1 class="h4 mb-3">Contraseña actualizada</h1>
        <p>Tu contraseña se cambió correctamente.</p>
        <a id="login-link" href="{% url 'login' %}" class="btn btn-primary">
            Ir a iniciar sesión
        </a>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    const loginUrl = document.getElementById('login-link').href;
    const redirectToLogin = function () {
        window.location.replace(loginUrl);
    };

    window.setTimeout(redirectToLogin, 4000);

    if (window.Swal) {
        Swal.fire({
            icon: 'success',
            title: 'Contraseña restablecida',
            text: 'Ahora puedes iniciar sesión con tu nueva contraseña.',
            confirmButtonText: 'Ir al inicio de sesión',
            allowOutsideClick: false,
            allowEscapeKey: false,
            timer: 4000,
            timerProgressBar: true
        }).then(redirectToLogin);
    }
</script>
{% endblock %}
