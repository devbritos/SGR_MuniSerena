{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card p-4 form-card" style="width: 350px;">
        <h3 class="mb-3">Recuperar contraseña</h3>
        <p class="text-muted">Ingresa tu correo y te enviaremos instrucciones.</p>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100">Enviar</button>
        </form>
        <a href="{% url 'login' %}" class="d-block mt-3 text-center">Volver a iniciar sesión</a>
        <a href="{% url 'password_recovery_request' %}" class="d-block mt-2 text-center">Usar código de seis dígitos</a>
    </div>
</div>
{% endblock %}
