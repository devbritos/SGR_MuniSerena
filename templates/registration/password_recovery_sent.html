{% extends "base.html" %}
{% block title %}Código enviado{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <i class="bi bi-envelope-check fs-1 text-primary"></i>
                <h1 class="h4 mt-3">Revisa tu correo</h1>
                <p>Si existe una cuenta activa con ese correo, recibirás un código de recuperación válido por unos minutos.</p>
                <a href="{% url 'password_recovery_verify' %}" class="btn btn-primary w-100">Ingresar código</a>
                <a href="{% url 'login' %}" class="d-block mt-3">Volver al inicio de sesión</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
