{% if page_obj.has_other_pages %}<nav aria-label="Páginas del listado" class="d-flex justify-content-between align-items-center gap-3 mt-4"><span class="small text-muted">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span><div class="d-flex gap-2">{% if page_obj.has_previous %}<a class="btn btn-outline-secondary" href="?page={{ page_obj.previous_page_number }}">Anterior</a>{% endif %}{% if page_obj.has_next %}<a class="btn btn-outline-secondary" href="?page={{ page_obj.next_page_number }}">Siguiente</a>{% endif %}</div></nav>{% endif %}
