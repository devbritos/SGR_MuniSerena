{% extends "base.html" %}

{% block title %}Quitar rol — SGR{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-danger text-white">
                <h1 class="h5 mb-0"><i class="bi bi-shield-x me-2"></i>Quitar rol</h1>
            </div>
            <div class="card-body p-4">
                <p>¿Quitar el rol <strong>{{ object.role.get_role_name_display }}</strong> de <strong>{{ object.functionary.full_name }}</strong>?</p>
                <form method="post" class="d-flex justify-content-end gap-2 pt-3 border-top">
                    {% csrf_token %}
                    <a href="{% url 'personal:functionary_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger" data-confirm-delete="Se quitará este rol del funcionario.">
                        Quitar rol
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
