{% extends "base.html" %}

{% block title %}Eliminar rol — SGR{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-danger text-white">
                <h1 class="h5 mb-0"><i class="bi bi-trash3 me-2"></i>Desactivar rol</h1>
            </div>
            <div class="card-body p-4">
                <p>¿Deseas desactivar el rol <strong>{{ object.get_role_name_display }}</strong>?</p>
                <p class="text-muted">Se conservarán las asignaciones históricas y el rol dejará de conceder permisos.</p>
                <form method="post" class="d-flex justify-content-end gap-2 pt-3 border-top">
                    {% csrf_token %}
                    <a href="{% url 'personal:role_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-danger" data-confirm-delete="Se desactivará el rol seleccionado.">
                        Sí, desactivar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
