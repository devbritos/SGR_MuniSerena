{% extends "base.html" %}

{% block title %}Desactivar cargo — SGR{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-warning text-dark">
                <h1 class="h5 mb-0"><i class="bi bi-exclamation-triangle me-2"></i>Desactivar cargo</h1>
            </div>
            <div class="card-body p-4">
                <p>¿Deseas desactivar el cargo <strong>{{ object.name }}</strong>?</p>
                <p class="text-muted">El registro se conservará y dejará de estar disponible para nuevas asignaciones.</p>
                <form method="post" class="d-flex justify-content-end gap-2 pt-3 border-top">
                    {% csrf_token %}
                    <a href="{% url 'personal:position_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-warning" data-confirm-delete="El cargo quedará inactivo.">
                        Desactivar
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
