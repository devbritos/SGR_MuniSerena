<form method="get" action="{{ request.path }}" class="row g-2 align-items-end mb-3">
    {% for key, value in request.GET.items %}
        {% if key != 'sort' and key != 'page' and key != 'export' %}
        <input type="hidden" name="{{ key }}" value="{{ value }}">
        {% endif %}
    {% endfor %}
    <div class="col-12 col-sm-6 col-md-4 col-lg-3">
        <label class="form-label small fw-semibold mb-1" for="list-sort">Ordenar resultados</label>
        <select id="list-sort" name="sort" class="form-select form-select-sm">
            <option value="">Orden predeterminado</option>
            {% for value, label in sort_options %}
            <option value="{{ value }}" {% if selected_sort == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-auto">
        <button type="submit" class="btn btn-sm btn-outline-primary">
            <i class="bi bi-sort-down me-1" aria-hidden="true"></i>Aplicar orden
        </button>
    </div>
</form>
